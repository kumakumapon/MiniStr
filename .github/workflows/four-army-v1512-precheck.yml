name: Four-army v1.5.12 final Worker check
on:
  push:
    branches: [diagnostics/v1.5.12-precheck]
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: sudo bash scripts/use-ubuntu-https-mirror.sh
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/e2e/four-army-cpu.spec.ts
      - name: Preserve final Worker evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: four-army-v1512-final-worker-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
