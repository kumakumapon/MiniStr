name: Research v1.5.8 precheck
on:
  push:
    branches: [diagnostics/v1.5.8-precheck]
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:test
      - run: npx vitest run src/game/research.test.ts src/ui/research.test.ts src/game/backup.test.ts
      - run: npm run build
      - run: sudo bash scripts/use-ubuntu-https-mirror.sh
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npx playwright test tests/e2e/research.spec.ts --workers=2
