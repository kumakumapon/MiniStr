name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:

# Verification jobs, including fork PRs, use read-only tokens and no secrets.
permissions:
  contents: read

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-hygiene
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject private session links in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # An unavailable base never skips the commit and tracked-file gate.
          if ! git rev-parse --quiet --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          scripts/check-private-links.sh "${BASE_SHA}..${HEAD_SHA}"

  test-and-build:
    if: always()
    needs: [quality-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-quality
      cancel-in-progress: true
    steps:
      - name: Require every quality shard to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality-shard.result }}
        run: test "$QUALITY_RESULT" = success

  quality-shard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser-shard: [1, 2]
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-quality-${{ matrix.browser-shard }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm run test:ci
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - name: Verify dependency compatibility
        run: npm ls --all
      - name: Snapshot dependency audit and reject high or critical findings
        env:
          DEPENDENCY_AUDIT_PATH: dependency-audit.json
        run: node_modules/.bin/vite-node scripts/dependency-audit.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:ui
      - name: Use Ubuntu HTTPS mirror for browser dependencies
        run: sudo bash scripts/use-ubuntu-https-mirror.sh
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Provide a virtual audio output for native browser recovery tests
        run: |
          sudo apt-get install --yes --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ministr_ci
          pactl set-default-sink ministr_ci
          pactl list short sinks
      - name: Check audio recovery before the full browser suite
        run: npx playwright test tests/e2e/army-music.spec.ts --grep 'background return'
      - name: Check WebKit spectator pause before the full browser suite
        run: npx playwright test tests/e2e/save-safety.spec.ts --project=webkit --grep 'pauses inside combat.*1280/en|ignores a cancelled fallback'
      - run: npm run test:e2e -- --shard=${{ matrix.browser-shard }}/2
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ matrix.browser-shard }}
          path: dependency-audit.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Preserve browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-traces-${{ matrix.browser-shard }}
          path: test-results/
          retention-days: 14
      - name: Preserve standalone system screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: standalone-system-screenshots-${{ matrix.browser-shard }}
          path: test-results/**/systems-*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the verified Pages build
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && matrix.browser-shard == 1
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  runtime-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-runtime
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm run test:ci
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm ls --all
      - run: npm run typecheck:test
      - run: npm test
      - run: npm run build

  terrain-stability:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-terrain
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run build
      - name: Use Ubuntu HTTPS mirror for browser dependencies
        run: sudo bash scripts/use-ubuntu-https-mirror.sh
      - run: npx playwright install --with-deps webkit
      - name: Repeat terrain comparisons without retries
        run: npx playwright test tests/e2e/terrain-presentation.spec.ts --project=webkit --repeat-each=3 --workers=2
      - name: Preserve terrain stability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terrain-stability
          path: test-results/
          retention-days: 14

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [commit-hygiene, test-and-build, runtime-compatibility, terrain-stability]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages-production
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Confirm this build is still current main
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/pages-preflight.mjs
      - id: deployment
        if: steps.publication.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
