name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Fork pull requests receive GitHub's read-only token and no repository secrets.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commit-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject private session links in commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          # A new branch or a force push reports an unusable base, so fall back
          # to the pushed commit alone rather than skipping the check.
          if ! git rev-parse --quiet --verify "${BASE_SHA}^{commit}" >/dev/null 2>&1; then
            BASE_SHA="${HEAD_SHA}^"
          fi
          scripts/check-private-links.sh "${BASE_SHA}..${HEAD_SHA}"

  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Generate candidate lockfile for dependency review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit
          npm update undici --package-lock-only --ignore-scripts --no-audit
          python3 - <<'PYLOCK'
          import base64
          from pathlib import Path
          data = base64.b64encode(Path('package-lock.json').read_bytes()).decode()
          for start in range(0, len(data), 12000):
              print('V110_LOCK:' + data[start:start + 12000])
          PYLOCK
      - run: npm ci
      - name: Snapshot dependency audit for release review
        run: node_modules/.bin/vite-node scripts/dependency-audit.ts
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck:test
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run test:ui
      - name: Use Ubuntu HTTPS mirror for browser dependencies
        run: sudo bash scripts/use-ubuntu-https-mirror.sh
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      - name: Preserve browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-traces
          path: test-results/
          retention-days: 14
      - name: Preserve standalone system screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standalone-system-screenshots
          path: test-results/**/systems-*.png
          if-no-files-found: ignore
          retention-days: 14
