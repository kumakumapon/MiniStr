name: Publish v1.5.6

on:
  push:
    branches: [release/v1.5.6-publish]
    paths: [.github/workflows/publish-v1.5.6.yml]

permissions:
  contents: read

concurrency:
  group: publish-release-v1.5.6
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'kumakumapon/MiniStr' && github.event_name == 'push' && github.ref == 'refs/heads/release/v1.5.6-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Verify published build and create the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          const VERIFIED_RUNS = [43027844758, 43027844323];
          const PAGES_ARTIFACT = 13861187331;
          const PAGES_DIGEST = 'sha256:cc8b83ec89ae0848d26a2a4566aef28ea768e4276461a989140ec4d027e23ddd';
          const DEPLOY_JOB = 130558152926;
          export const TARGET = 'ffe87428a4f9941024ed19b98e75938cbb081e9f';
          export const TAG = 'v1.5.6';
          const check = (value, message) => { if (!value) throw new Error(message); };

          export async function publishRelease(api) {
            const main = await api('GET', '/git/ref/heads/main');
            check(main?.object?.sha === TARGET, 'Current main differs from the approved release target.');
            const pkg = await api('GET', `/contents/package.json?ref=${TARGET}`);
            check(pkg?.encoding === 'base64', 'Missing package metadata.');
            check(JSON.parse(Buffer.from(pkg.content, 'base64').toString()).version === '1.5.6', 'Unexpected version.');
            for (const id of VERIFIED_RUNS) {
              const run = await api('GET', `/actions/runs/${id}`);
              check(run?.head_sha === TARGET && run.status === 'completed' && run.conclusion === 'success' && run.head_branch === 'main', `Verification run ${id} did not succeed for the target.`);
            }
            const artifact = await api('GET', '/actions/artifacts/' + PAGES_ARTIFACT);
            check(artifact?.name === 'github-pages' && !artifact.expired && artifact.workflow_run?.head_sha === TARGET && artifact.workflow_run?.id === VERIFIED_RUNS[0]
              && artifact.digest === PAGES_DIGEST, 'Pages artifact does not match the verified build.');
            const deployment = await api('GET', '/actions/jobs/' + DEPLOY_JOB);
            check(deployment?.run_id === VERIFIED_RUNS[0] && deployment.conclusion === 'success' && deployment.status === 'completed'
              && deployment.steps?.some(step => step.name === 'Confirm this build is still current main' && step.conclusion === 'success'), 'Pages deployment was not verified.');
            const refPath = `/git/ref/tags/${TAG}`;
            const ref = await api('GET', refPath);
            check(!ref || (ref.object?.type === 'commit' && ref.object.sha === TARGET), 'Existing tag points elsewhere; refusing to overwrite.');
            const existing = await api('GET', `/releases/tags/${TAG}`);
            const verifyRelease = release => {
              check(release?.tag_name === TAG && release.draft === false && release.prerelease === false
                && release.html_url === `https://github.com/kumakumapon/MiniStr/releases/tag/${TAG}`, 'Release metadata was not confirmed.');
            };
            if (existing) {
              check(ref, 'Existing release has no verified tag.');
              verifyRelease(existing);
              return existing;
            }
            const notes = await api('GET', `/contents/docs/releases/${TAG}.md?ref=${TARGET}`);
            check(notes?.encoding === 'base64', 'Missing release notes.');
            let body = Buffer.from(notes.content, 'base64').toString();
            check(body.startsWith(`# ${TAG}\n`), 'Release notes version does not match.');
            body = body.replaceAll('/blob/main/', `/blob/${TARGET}/`)
              + `\n## 検証・公開\n\n対象: \`${TARGET}\`（PR #281）。\n\n`
              + '- [main CI・Pages](https://github.com/kumakumapon/MiniStr/actions/runs/' + VERIFIED_RUNS[0] + ')・[CodeQL](https://github.com/kumakumapon/MiniStr/actions/runs/' + VERIFIED_RUNS[1] + '): 成功。\n'
              + '- 単体1,658件、配布UI67件、E2E577件、WebKit地形33件、Node22.13互換を確認。\n'
              + '- 護衛seed15411はT3敗北からT10達成へ改善。180条件で達成162→164、従来勝利の敗北化なし。seed15241 T23・15422 T18達成を維持。\n'
              + '- 390幅・32盤面・英語の兵站一覧同期中央値: Chromium17.2→9.9ms、Firefox23.5→9ms、WebKit41→11ms。全18条件の結果と初回・復帰などの残る制限を確認記録へ保存。\n'
              + '- Pages artifact ' + PAGES_ARTIFACT + '、digest ' + PAGES_DIGEST + ' と公開対象SHAを照合済み。\n'
              + '- [ゲーム](https://kumakumapon.github.io/MiniStr/)\n';
            check((await api('GET', '/git/ref/heads/main'))?.object?.sha === TARGET, 'Main changed during preflight.');
            if (!ref) await api('POST', '/git/refs', { ref: `refs/tags/${TAG}`, sha: TARGET });
            check((await api('GET', refPath))?.object?.sha === TARGET, 'Tag was not created at the approved commit.');
            const release = await api('POST', '/releases', { tag_name: TAG, target_commitish: TARGET, name: TAG, body, draft: false, prerelease: false, make_latest: 'true' });
            verifyRelease(release);
            check((await api('GET', refPath))?.object?.sha === TARGET, 'Tag changed during publication.');
            return release;
          }

          export async function verifyDeployedBuild(fetchPage) {
            const site = new URL('https://kumakumapon.github.io/MiniStr/');
            const fetchText = async url => {
              const response = await fetchPage(url, { redirect: 'error', signal: AbortSignal.timeout(30_000),
                headers: { 'cache-control': 'no-cache' } });
              check(response.ok, 'Could not read the deployed Pages build.');
              return response.text();
            };
            const html = await fetchText(site.href + '?release=v1.5.6');
            const scripts = [...html.matchAll(/<script\b[^>]*\bsrc=["']([^"']+)["'][^>]*>/g)]
              .map(match => new URL(match[1], site));
            const entries = scripts.filter(url => url.origin === site.origin
              && url.pathname.startsWith('/MiniStr/assets/') && url.pathname.endsWith('.js'));
            check(entries.length === 1, 'Could not identify the deployed entry bundle.');
            const code = await fetchText(entries[0].href);
            const identity = code.match(/\{\s*version\s*:\s*(["'\x60])([^"'\x60\r\n]+)\1\s*,\s*sha\s*:\s*(["'\x60])([a-f0-9]{40})\3\s*\}/);
            console.log('Live Pages build: ' + JSON.stringify({ entry: entries[0].href,
              version: identity?.[2] ?? null, sha: identity?.[4] ?? null, literalQuote: identity?.[1] ?? null }));
            check(identity?.[2] === '1.5.6' && identity?.[4] === TARGET,
              'Live Pages version/SHA does not match the release target.');
            console.log('Verified live Pages v1.5.6 at ' + TARGET);
          }

          // Exercise publication guards with synthetic responses before any network or writes.
          const { strict: assert } = await import('node:assert');
          let guardTests = 0;
          const fixture = () => {
            const records = new Map();
            records.set('/git/ref/heads/main', { object: { sha: TARGET } });
            records.set('/contents/package.json?ref=' + TARGET, { encoding: 'base64', content: Buffer.from(JSON.stringify({ version: TAG.slice(1) })).toString('base64') });
            for (const id of VERIFIED_RUNS) records.set('/actions/runs/' + id, { head_sha: TARGET, head_branch: 'main', status: 'completed', conclusion: 'success' });
            records.set('/actions/artifacts/' + PAGES_ARTIFACT, { name: 'github-pages', expired: false, workflow_run: { head_sha: TARGET, id: VERIFIED_RUNS[0] }, digest: PAGES_DIGEST });
            records.set('/actions/jobs/' + DEPLOY_JOB, { run_id: VERIFIED_RUNS[0], status: 'completed', conclusion: 'success', steps: [{ name: 'Confirm this build is still current main', conclusion: 'success' }] });
            records.set('/contents/docs/releases/' + TAG + '.md?ref=' + TARGET, { encoding: 'base64', content: Buffer.from('# ' + TAG + '\n\nVerified notes.\n').toString('base64') });
            const writes = [];
            let mainReads = 0;
            const api = async (method, path, body) => {
              if (path === '/git/ref/heads/main') mainReads++;
              if (method === 'GET') return structuredClone(records.get(path) ?? null);
              writes.push({ method, path, body });
              if (path === '/git/refs') records.set('/git/ref/tags/' + TAG, { object: { type: 'commit', sha: body.sha } });
              if (path === '/releases') {
                const release = { ...body, html_url: 'https://github.com/kumakumapon/MiniStr/releases/tag/' + TAG };
                records.set('/releases/tags/' + TAG, release);
                return release;
              }
              return {};
            };
            return { records, writes, api, mainReads: () => mainReads };
          };
          {
            const f = fixture();
            await publishRelease(f.api);
            assert.equal(f.writes.length, 2);
            assert.equal(f.writes[0].body.sha, TARGET);
            assert.equal(f.writes[1].body.draft, false);
            assert.equal(f.writes[1].body.prerelease, false);
            assert.equal(f.writes[1].body.make_latest, 'true');
            assert.ok(f.mainReads() >= 2);
            await publishRelease(f.api);
            assert.equal(f.writes.length, 2);
            guardTests += 2;
          }
          const invalid = [
            f => f.records.get('/git/ref/heads/main').object.sha = '0'.repeat(40),
            f => f.records.set('/contents/package.json?ref=' + TARGET, null),
            f => f.records.set('/contents/package.json?ref=' + TARGET, { encoding: 'base64', content: Buffer.from('{"version":"0.0.0"}').toString('base64') }),
            ...VERIFIED_RUNS.flatMap(id => [
              f => f.records.get('/actions/runs/' + id).head_sha = '0'.repeat(40),
              f => f.records.get('/actions/runs/' + id).conclusion = 'failure',
              f => f.records.get('/actions/runs/' + id).head_branch = 'feature',
            ]),
            f => f.records.get('/actions/artifacts/' + PAGES_ARTIFACT).expired = true,
            f => f.records.get('/actions/artifacts/' + PAGES_ARTIFACT).digest = 'sha256:wrong',
            f => f.records.get('/actions/artifacts/' + PAGES_ARTIFACT).workflow_run.head_sha = '0'.repeat(40),
            f => f.records.get('/actions/jobs/' + DEPLOY_JOB).conclusion = 'failure',
            f => f.records.get('/actions/jobs/' + DEPLOY_JOB).steps = [],
            f => f.records.set('/git/ref/tags/' + TAG, { object: { type: 'commit', sha: '0'.repeat(40) } }),
            f => f.records.set('/git/ref/tags/' + TAG, { object: { type: 'tag', sha: TARGET } }),
            f => { f.records.set('/git/ref/tags/' + TAG, { object: { type: 'commit', sha: TARGET } }); f.records.set('/releases/tags/' + TAG, { tag_name: TAG, draft: true, prerelease: false, html_url: 'https://github.com/kumakumapon/MiniStr/releases/tag/' + TAG }); },
            f => f.records.set('/contents/docs/releases/' + TAG + '.md?ref=' + TARGET, { encoding: 'base64', content: Buffer.from('# Wrong\n').toString('base64') }),
          ];
          for (const mutate of invalid) {
            const f = fixture(); mutate(f);
            await assert.rejects(() => publishRelease(f.api));
            assert.equal(f.writes.length, 0);
            guardTests++;
          }
          {
            const f = fixture();
            const api = (method, path, body) => method === 'GET' && path === '/git/ref/heads/main' && f.mainReads() > 0
              ? { object: { sha: '0'.repeat(40) } } : f.api(method, path, body);
            await assert.rejects(() => publishRelease(api));
            assert.equal(f.writes.length, 0);
            guardTests++;
          }
          const pageMock = (code, html = '<script type="module" src="/MiniStr/assets/index-test.js"></script>', ok = true) =>
            async url => ({ ok, text: async () => url.includes('/assets/') ? code : html });
          for (const quote of ['"', "'", String.fromCharCode(96)]) {
            await verifyDeployedBuild(pageMock('{version:' + quote + TAG.slice(1) + quote + ',sha:' + quote + TARGET + quote + '}'));
            guardTests++;
          }
          for (const mock of [
            pageMock('{version:"0.0.0",sha:"' + TARGET + '"}'),
            pageMock('{version:"' + TAG.slice(1) + '",sha:"' + '0'.repeat(40) + '"}'),
            pageMock('{}'),
            pageMock('{}', '<script src="https://example.org/MiniStr/assets/x.js"></script>'),
            pageMock('{}', '<script src="/MiniStr/assets/a.js"></script><script src="/MiniStr/assets/b.js"></script>'),
            pageMock('{}', '', false),
          ]) { await assert.rejects(() => verifyDeployedBuild(mock)); guardTests++; }
          console.log('Publication guard tests passed: ' + guardTests);
          check(process.env.GITHUB_REPOSITORY === 'kumakumapon/MiniStr'
            && process.env.GITHUB_REF === 'refs/heads/release/v1.5.6-publish'
            && process.env.GITHUB_EVENT_NAME === 'push' && process.env.GH_TOKEN, 'Invalid publication context.');
          const api = async (method, path, data) => {
            const response = await fetch(`https://api.github.com/repos/kumakumapon/MiniStr${path}`, {
              method,
              headers: { authorization: `Bearer ${process.env.GH_TOKEN}`, accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28', 'content-type': 'application/json' },
              body: data === undefined ? undefined : JSON.stringify(data),
              redirect: 'error', signal: AbortSignal.timeout(30_000),
            });
            if (method === 'GET' && response.status === 404) return null;
            if (!response.ok) throw new Error(`GitHub HTTP ${response.status}: ${method} ${path}`);
            return response.json();
          };
          await verifyDeployedBuild(fetch);
          const release = await publishRelease(api);
          console.log(`Published ${release.html_url} at ${TARGET}`);
          NODE
