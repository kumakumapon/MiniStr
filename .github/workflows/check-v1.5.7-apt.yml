name: Diagnose Ubuntu mirrors for v1.5.7

on:
  push:
    branches: [diagnostics/v1.5.7-apt]
    paths: [.github/workflows/check-v1.5.7-apt.yml]

permissions:
  contents: read

jobs:
  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official signed Ubuntu indexes over HTTPS
        shell: bash
        run: |
          set -u
          for mirror_url in \
            https://archive.ubuntu.com/ubuntu \
            https://security.ubuntu.com/ubuntu \
            https://azure.archive.ubuntu.com/ubuntu \
            https://mirrors.edge.kernel.org/ubuntu \
            https://mirrors.kernel.org/ubuntu \
            https://mirror.hetzner.com/ubuntu/packages; do
            mirror_host="${mirror_url#https://}"
            mirror_host="${mirror_host%%/*}"
            if timeout 3 getent ahosts "$mirror_host" >/dev/null; then
              echo "DNS ready: $mirror_host"
            else
              echo "DNS unavailable: $mirror_host"
            fi
            curl --proto '=https' --silent --show-error --connect-timeout 3 --max-time 5 \
              --output /dev/null --write-out "HTTPS %{http_code}: $mirror_url/dists/resolute/InRelease\\n" \
              "$mirror_url/dists/resolute/InRelease" || true
          done
