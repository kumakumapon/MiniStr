name: Verify Ubuntu mirror signatures for v1.5.7

on:
  push:
    branches: [diagnostics/v1.5.7-apt]
    paths: [.github/workflows/check-v1.5.7-apt.yml]

permissions:
  contents: read

jobs:
  signatures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify all required Ubuntu indexes with the existing archive keyring
        shell: bash
        run: |
          set -euo pipefail
          for ubuntu_suite in resolute resolute-updates resolute-security; do
            index_file="/tmp/ministr-v157-$ubuntu_suite.InRelease"
            curl --proto '=https' --fail --silent --show-error --connect-timeout 5 --max-time 20 \
              --output "$index_file" "https://mirrors.edge.kernel.org/ubuntu/dists/$ubuntu_suite/InRelease"
            gpgv --keyring /usr/share/keyrings/ubuntu-archive-keyring.gpg "$index_file"
            echo "Verified Ubuntu signature: $ubuntu_suite"
            sha256sum "$index_file"
          done
