name: PR 248 terrain stress validation
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pr248-evidence.yml', 'tests/e2e/terrain-presentation.spec.ts', 'tests/e2e/helpers/terrainPixels.ts']
permissions:
  contents: read
jobs:
  repeat-webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.9.0
      - run: npm ci
      - run: npm run build
      - run: sudo bash scripts/use-ubuntu-https-mirror.sh
      - run: npx playwright install --with-deps webkit
      - name: Repeat every theme and viewport five times without retries
        run: npx playwright test tests/e2e/terrain-presentation.spec.ts --project=webkit --repeat-each=5 --workers=2 --reporter=line
      - name: Preserve stress evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr248-webkit-stress
          path: test-results/
          retention-days: 14
